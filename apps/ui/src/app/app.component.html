<mat-toolbar color="primary" class="starter-toolbar">
  <span>
    <button mat-button routerLink="/">UI Starter</button>
    <button mat-button routerLink="/"><mat-icon>home</mat-icon></button>
    <button mat-button routerLink="/mcp">
      <mat-icon>smart_toy</mat-icon>
      MCP
    </button>
  </span>
  <span class="starter-toolbar-spacer"></span>
  <div class="starter-toolbar-actions">
    <button mat-button routerLink="/auth/login" *ngIf="!isAuthenticated">
      <mat-icon>login</mat-icon>
      Login
    </button>
    <button mat-button *ngIf="isAuthenticated" (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      Logout
    </button>
  </div>
  <button mat-button [matMenuTriggerFor]="menu" class="starter-toolbar-menu">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>
<mat-menu xPosition="before" #menu="matMenu">
  <button mat-menu-item routerLink="/">
    <mat-icon>home</mat-icon>
    Home
  </button>
  <button mat-menu-item routerLink="/mcp">
    <mat-icon>smart_toy</mat-icon>
    MCP Chat
  </button>
  <button mat-menu-item routerLink="/auth/login" *ngIf="!isAuthenticated">
    <mat-icon>login</mat-icon>
    Login
  </button>
  <button mat-menu-item *ngIf="isAuthenticated" (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
    Logout
  </button>
</mat-menu>
<router-outlet></router-outlet>
