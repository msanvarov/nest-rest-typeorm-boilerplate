services:
  api:
    build: .
    container_name: nest-rest-typeorm-api
    depends_on:
      - db
    environment:
      APP_ENV: production
      PORT: 3333
      WEBTOKEN_ENCRYPTION_KEY: uAsBw6WxqD
      WEBTOKEN_EXPIRATION_TIME: 2400
      DB_TYPE: mysql
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nest
      MCP_SERVER_NAME: nest-rest-typeorm-mcp
      MCP_SERVER_VERSION: 1.0.0
    ports:
      - '3333:3333'
    links:
      - db
  db:
    image: mysql:8
    container_name: nest-db
    environment:
      MYSQL_DATABASE: nest
      MYSQL_ROOT_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
